<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

  :root {
    --bg: #FFFFFF;
    --navy: #0F1A14;
    --brand-green: #0A7F55;
    --mint: #24B47E;
    --muted: #6B766F;
    --border: rgba(10, 127, 85, 0.16);
    --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #e5e7eb;
    margin: 0;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  /* 1200x630 Link Preview (Landscape) */
  .canvas-1200x630 {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    padding: 56px 64px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    position: relative;
    overflow: hidden;
  }

  .canvas-1200x630 .text-col {
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    z-index: 2;
  }

  .canvas-1200x630 .header-area {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .category-label {
    display: inline-flex;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    color: var(--brand-green);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 24px;
    background: transparent;
    border: none;
    padding: 0;
  }

  .canvas-1200x630 h1 {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--navy);
    letter-spacing: -0.025em;
    max-width: 520px;
    margin-top: 4px;
    text-wrap: balance;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 22px;
    font-weight: 600;
    color: var(--muted);
    border-top: 1px solid #E5E8F0;
    padding-top: 22px;
    width: 100%;
  }

  .footer-row .brand {
    color: var(--navy);
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .canvas-1200x630 .art-col {
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 100%;
  }

  .canvas-1200x630 .art-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: #FFFFFF;
    box-shadow: 0 6px 24px rgba(15, 26, 20, 0.07);
    border: 1px solid var(--border);
    display: block;
    position: relative;
  }

  .canvas-1200x630 .art-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 1080x1080 Square Variant */
  .canvas-1080x1080 {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .canvas-1080x1080 .art-top {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: #FFFFFF;
    border: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(15, 26, 20, 0.07);
    display: block;
    position: relative;
    padding: 0;
  }

  .canvas-1080x1080 .art-top img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .canvas-1080x1080 .content-bottom {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex: 1;
    padding-top: 36px;
  }

  .canvas-1080x1080 h1 {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--navy);
    letter-spacing: -0.025em;
    margin-top: 8px;
    margin-bottom: 24px;
    text-wrap: balance;
    max-width: 860px;
  }
</style>
</head>
<body>

  <!-- Mode: landscape (1200x630) -->
  <div id="landscape" class="canvas-1200x630">
    <div class="text-col">
      <div class="header-area">
        <span class="category-label">{{category}}</span>
        <h1>{{headline}}</h1>
      </div>
      <div class="footer-row">
        <span class="brand">Ship Thesis</span>
        <span>shipthesis.com</span>
      </div>
    </div>
    <div class="art-col">
      <div class="art-frame">
        <img src="{{illustration}}" alt="{{alt}}">
      </div>
    </div>
  </div>

  <!-- Mode: square (1080x1080) -->
  <div id="square" class="canvas-1080x1080">
    <div class="art-top">
      <img src="{{illustration}}" alt="{{alt}}">
    </div>
    <div class="content-bottom">
      <div>
        <span class="category-label">{{category}}</span>
        <h1>{{headline}}</h1>
      </div>
      <div class="footer-row">
        <span class="brand">Ship Thesis</span>
        <span>shipthesis.com</span>
      </div>
    </div>
  </div>

</body>
</html>
